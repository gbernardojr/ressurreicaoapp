workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: 3.41.6
      java: 17
      groups:
        - android_signing
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Instalar dependencias
        script: flutter pub get
      - name: Analisar
        script: flutter analyze
      - name: Rodar testes
        script: flutter test
      - name: Configurar assinatura Android
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$CM_KEYSTORE_PASSWORD" "$CM_KEY_PASSWORD" "$CM_KEY_ALIAS" > android/key.properties
          fi
      - name: Build APK
        script: flutter build apk --release
      - name: Build App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab

  ios-release:
    name: iOS Release (TestFlight)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.6
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.cemiteriodaressurreicao.app
    cache:
      cache_paths:
        - ~/.pub-cache
    integrations:
      # O nome precisa ser igual ao da integracao App Store Connect no painel do Codemagic.
      app_store_connect: Codemagic
    scripts:
      - name: Instalar dependencias
        script: flutter pub get
      - name: Analisar
        script: flutter analyze
      - name: Rodar testes
        script: flutter test
      - name: Configurar assinatura iOS
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
